.years{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.chip small{display:block;font-weight:400;font-size:.65rem;color:var(--sub);margin-top:2px}
.chip.on{border-color:#6366f1;background:#eef2ff;color:#4338ca;transform:scale(1.04)}
.chip.on::after{content:"✓";position:absolute;top:-7px;right:-7px;background:#6366f1;color:#fff;width:20px;height:20px;border-radius:50%;font-size:.7rem;line-height:20px}
.mini{display:flex;gap:8px;margin-top:10px}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:2px solid #e5e7eb;border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;transition:.2s;background:#f9fafb}

.switch{position:relative;width:46px;height:26px;background:#d1d5db;border-radius:999px;cursor:pointer;transition:.2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:#10b981}.switch.on::after{left:23px}
.count{text-align:center;color:#fff;margin:6px 0 12px;font-size:.9rem}
.count b{font-size:1.4rem;color:var(--gold)}
.btn{display:block;width:100%;border:none;border-radius:18px;padding:16px;font-size:1.1rem;font-weight:800;cursor:pointer;transition:transform .1s,box-shadow .2s;letter-spacing:.05em}
.btn:active{transform:scale(.96)}
.btn-start{background:linear-gradient(90deg,#f472b6,#fb923c,#facc15);color:#3b0764;box-shadow:0 8px 24px rgba(251,146,60,.5);animation:pulse 2s infinite}

.reset{background:none;border:none;color:#a5b4fc;font-size:.75rem;display:block;margin:14px auto 0;text-decoration:underline;cursor:pointer}
.topbar{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:10px}

.num{font-size:.8rem;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.stats{display:flex;justify-content:space-between;color:#fff;font-size:.8rem;margin-bottom:10px}
.combo{font-weight:800;transition:.2s}

.seen{font-size:.72rem;color:var(--sub);text-align:center;margin-bottom:14px}
.box{border-radius:14px;margin-top:12px;overflow:hidden;max-height:0;opacity:0;transition:max-height .5s ease,opacity .4s ease,padding .4s;padding:0 14px}
.box.show{max-height:1600px;opacity:1;padding:14px}
.box h3{margin:0 0 6px;font-size:.85rem}
.box p{margin:0;font-size:.92rem;line-height:1.75;white-space:pre-wrap}
.hint{background:#fffbeb;border:2px dashed #fbbf24}
.ans{background:#ecfdf5;border:2px solid #34d399}
.empty{color:#9ca3af;font-style:italic}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn-hint{background:#fef3c7;color:#92400e;font-size:.95rem;padding:14px}
.btn-ans{background:linear-gradient(90deg,#10b981,#06b6d4);color:#fff;font-size:.95rem;padding:14px;box-shadow:0 6px 16px rgba(16,185,129,.4)}
.judge{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.judge.show{display:grid;animation:fadeUp .4s}
.btn-ng{background:#fee2e2;color:#b91c1c;font-size:.95rem;padding:14px}
.btn-ok{background:linear-gradient(90deg,#6366f1,#ec4899);color:#fff;font-size:.95rem;padding:14px}
.swipe-tip{text-align:center;color:#a5b4fc;font-size:.72rem;margin-top:12px}

@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.result{text-align:center}
.trophy{font-size:4.5rem;animation:float 2.5s ease-in-out infinite;display:inline-block}

.ring{width:150px;height:150px;margin:10px auto;position:relative}

.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}

.yearstat{display:block;height:4px;background:#e5e7eb;border-radius:4px;margin-top:6px;overflow:hidden}

</style>
</head>

    answer: "・直交周波数分割多重の略で、複数の搬送波（サブキャリア）に乗せてデータを伝送する。隣り合うサブキャリアを直交させることにより、搬送周波数を近接させ、電波の利用効率を高めている。\n・マルチパスフェージングに強いという特徴を持っており、地上デジタル放送や無線LANで用いられる。"

  /* ===== 令和4年度：問題2・問題4 年度別回答 ===== */
  "R4|2|機器の据付け": {

    answer: "・設計図書の指示を遵守し、据付け場所の強度、メンテナンススペースの確保などについて確認した後、据付けを行う。\n・機器は、地震力に対して転倒したり横滑りしないよう、必要な強度を有するアンカーボルトで固定する。"

  "R4|2|二重天井内配線": {

    answer: "・支持具、支持材等を用い、ケーブル被覆を損傷しないよう造営材等に固定する。ケーブルの支持間隔は、2m以下とする。\n・強電流電線、水管、ガス管、ダクト等と接触しないように敷設する。"

    answer: "・アルミ製ケーブルラックは、支持物との間に異種金属接触による腐食を起こさないように取り付ける。\n・温度変化の大きな箇所に施設する直線部分の長いケーブルラックには、アルミ製では15mごとに伸縮継手金具を使用する。"

  "R4|2|電線等の防火区画の貫通": {
    hint: "🔥 金属管と壁の隙間を「モルタル・耐熱シール材」等の不燃材で充填\n🧱 または「ロックウール保温材」を詰め、上をモルタルで押える",
    answer: "・金属管が貫通する場合、金属管と壁等との隙間に、モルタル、耐熱シール材等の不燃材料を充填する。\n・金属管が貫通する場合、金属管と壁等との隙間に、ロックウール保温材を充填し、その上をモルタルで押える。"
  },
  "R4|4|移動式クレーン作業": {

    answer: "・軟弱地盤上では、事業者は転倒を防止するのに必要な鉄板等の上に移動式クレーンを設置する。\n・事業者は、つり荷が定格荷重を超えないよう作業を行う。"
  },
  "R4|4|危険物（ガソリン）の取扱い": {
    hint: "🔥 ガソリンを「火気・点火源」に近づけない／注がない／蒸発させない／加熱しない",
    answer: "・みだりに、火気その他点火源となるおそれのあるものに接近させ、もしくは注ぎ、蒸発させ、または加熱しない。"
  },
  "R4|4|脚立作業": {
    hint: "🪜 脚と水平面の角度は「75度以下」＋開き止め金具\n💪 脚立は丈夫な構造とする",
    answer: "・事業者は、脚立の脚と水平面の角度を75度以下とし、開き止め金具を使用する。\n・事業者は、脚立を丈夫な構造とする。"
  },
  "R4|4|作業場内の通路": {
    hint: "💡 照明設備は高さ「1.8m以上」または通路幅の外\n🚶 用途に応じた幅＋高さ1.8m以上・障害物なし／巡視で転倒防止",
    answer: "・通路に照明設備を、高さ1.8m以上の位置または用途に応じた幅の外に設ける。\n・通路は用途に応じた幅と高さ1.8m以上の空間を確保し、この中に障害物を置かない。\n・つまずき、すべり、踏抜等の危険のない状態を保持するよう安全パトロール等で監視する。"
  },
  "R4|4|酸素欠乏危険場所での作業": {
    hint: "🏃 おそれが生じたら「直ちに中止・退避」\n🌬️ 換気で酸素濃度「18%以上」を保持",
    answer: "・事業者は、作業を行う場所において酸素欠乏等のおそれが生じたときは、直ちに作業を中止し、労働者をその場所から退避させる。\n・事業者は、空気中の酸素濃度を18%以上に保つように換気を行う。"
  },

};

/* ============ アプリ本体 ============ */
const LS = "denki2ji_v1";
let store = JSON.parse(localStorage.getItem(LS) || '{"mastered":{},"seen":{},"xp":0,"days":[],"years":["R7","R6","R5","R4","R3","R2","R1"],"mode":"random","skip":false}');
const save = () => localStorage.setItem(LS, JSON.stringify(store));
const $ = id => document.getElementById(id);
const keyOf = q => q.p + "|" + q.term;
let ALL = [];
for (const y of Object.keys(DATA)) for (const p of [2,4,5]) DATA[y][p].forEach(t => ALL.push({y, p, term:t}));

function renderYears(){
  $("years").innerHTML = Object.keys(DATA).map(y=>{
    const items = ALL.filter(q=>q.y===y);
    const m = items.filter(q=>store.mastered[keyOf(q)]).length;
    return `<div class="chip ${store.years.includes(y)?'on':''}" data-y="${y}">${YEAR_LABEL[y]}<small>${m}/${items.length}</small><span class="yearstat"><i style="width:${m/items.length*100}%"></i></span></div>`;
  }).join("");
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    const y=c.dataset.y; store.years = store.years.includes(y)? store.years.filter(v=>v!==y) : [...store.years,y];
    save(); renderYears(); vib(10);
  });
  updateCount();
}
function pool(){
  const order = Object.keys(DATA);
  let list = ALL.filter(q=>store.years.includes(q.y));
  list.sort((a,b)=>order.indexOf(a.y)-order.indexOf(b.y) || a.p-b.p);
  if(store.skip) list = list.filter(q=>!store.mastered[keyOf(q)]);
  return list;
}
function updateCount(){
  const n = pool().length; $("qCount").textContent = n; $("startBtn").disabled = n===0;
  const total = new Set(ALL.map(keyOf)).size, m = Object.keys(store.mastered).length;
  $("masterTotal").textContent = `習得 ${m}/${total}語`;
  $("lvl").textContent = `Lv.${Math.floor(store.xp/100)+1}`;
  $("streakDays").textContent = `🔥 連続${streak()}日`;
}
function streak(){
  const d = new Set(store.days); let s=0, t=new Date();
  if(!d.has(ds(t))) t.setDate(t.getDate()-1);
  while(d.has(ds(t))){ s++; t.setDate(t.getDate()-1); }
  return s;
}
function ds(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
$("allOn").onclick=()=>{store.years=Object.keys(DATA);save();renderYears();};
$("allOff").onclick=()=>{store.years=[];save();renderYears();};
document.querySelectorAll(".mode").forEach(m=>{
  if(m.dataset.mode===store.mode){document.querySelectorAll(".mode").forEach(x=>x.classList.remove("on"));m.classList.add("on");}
  m.onclick=()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("on"));m.classList.add("on");store.mode=m.dataset.mode;save();vib(10);};
});
$("skipSw").classList.toggle("on",store.skip);
$("skipSw").onclick=()=>{store.skip=!store.skip;$("skipSw").classList.toggle("on",store.skip);save();updateCount();};
$("resetBtn").onclick=()=>{if(confirm("学習記録（覚えた・XP）をリセットしますか？")){store.mastered={};store.seen={};store.xp=0;store.days=[];save();renderYears();}};

let Q=[], idx=0, combo=0, maxCombo=0, okList=[], ngList=[], revealed=false;
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");window.scrollTo(0,0);}
function start(list){
  Q = list.slice();
  if(store.mode==="random") for(let i=Q.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[Q[i],Q[j]]=[Q[j],Q[i]];}
  idx=0;combo=0;maxCombo=0;okList=[];ngList=[];
  if(!store.days.includes(ds(new Date()))){store.days.push(ds(new Date()));save();}
  $("xp").textContent=store.xp; setCombo(false);
  show("quiz"); renderQ();
}
$("startBtn").onclick=()=>{burst(window.innerWidth/2,window.innerHeight*.8,40);setTimeout(()=>start(pool()),250);};

function renderQ(){
  const q=Q[idx], a=ANSWERS[q.y+"|"+keyOf(q)]||ANSWERS[keyOf(q)]||{};
  revealed=false;
  $("num").textContent=`${idx+1}/${Q.length}`;
  $("bar").style.width=(idx/Q.length*100)+"%";
  $("tags").innerHTML=`<span class="tag y">${YEAR_LABEL[q.y]}年度</span><span class="tag p${q.p}">${PNAME[q.p]}</span>`+(store.mastered[keyOf(q)]?'<span class="tag m">✓ 覚えた</span>':'');
  $("qtext").textContent=QTEXT[q.p];
  $("term").innerHTML=[...q.term].map((c,i)=>`<span style="animation-delay:${i*0.03}s">${c===" "?"&nbsp;":c}</span>`).join("");
  const others = ALL.filter(x=>keyOf(x)===keyOf(q)).map(x=>YEAR_LABEL[x.y]);
  $("seen").textContent = others.length>1 ? `🔁 頻出！ ${others.join("・")}年度に出題` : "";
  $("hint").innerHTML = a.hint ? esc(a.hint) : '<span class="empty">（ヒント未登録）</span>';
  $("ans").innerHTML = a.answer ? esc(a.answer) : '<span class="empty">（解答未登録）</span>';
  $("hintBox").classList.remove("show"); $("ansBox").classList.remove("show");
  $("actions").style.display="grid"; $("judge").classList.remove("show");
  const c=$("card"); c.classList.remove("enter","leave","shake"); void c.offsetWidth; c.classList.add("enter");
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
$("hintBtn").onclick=()=>{$("hintBox").classList.toggle("show");vib(10);};
$("ansBtn").onclick=()=>{
  $("ansBox").classList.add("show"); $("actions").style.display="none"; $("judge").classList.add("show"); revealed=true;
  const r=$("ansBtn").getBoundingClientRect(); sparkle(r.left+r.width/2,r.top);
  setTimeout(()=>$("ansBox").scrollIntoView({behavior:"smooth",block:"nearest"}),200);
};
$("okBtn").onclick=()=>judge(true);
$("ngBtn").onclick=()=>judge(false);
function judge(ok){
  if(!revealed) return; revealed=false;
  const q=Q[idx], k=keyOf(q);
  store.seen[k]=(store.seen[k]||0)+1;
  if(ok){
    okList.push(q); combo++; maxCombo=Math.max(maxCombo,combo);
    const gain = 10 + Math.min(combo,10)*2; store.xp+=gain; store.mastered[k]=true;
    const before=Math.floor((store.xp-gain)/100), after=Math.floor(store.xp/100);
    pop(after>before?`🎉 LEVEL UP! Lv.${after+1}`:combo>=3?`🔥 ${combo} COMBO! +${gain}XP`:`+${gain} XP`);
    burst(window.innerWidth/2,window.innerHeight*.45, combo>=5?90:45); vib([20,30,20]);
  }else{
    ngList.push(q); combo=0; delete store.mastered[k]; store.xp+=2;
    $("card").classList.add("shake"); pop("💪 次こそ！ +2XP"); vib(60);
  }
  save(); $("xp").textContent=store.xp; setCombo(ok);
  setTimeout(()=>{$("card").classList.add("leave");},ok?0:350);
  setTimeout(()=>{ idx++; if(idx<Q.length) renderQ(); else finish(); },ok?320:670);
}
function setCombo(bump){
  const c=$("combo"); c.textContent=`COMBO ${combo}`+(combo>=5?" 🔥":""); c.classList.toggle("hot",combo>=3);
  if(bump){c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");}
}
$("quitBtn").onclick=()=>{
  if(okList.length+ngList.length===0){show("top");renderYears();return;}
  if(confirm("ここで終了して結果を見ますか？")) finish();
};
let sx=null,sy=null;
$("card").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
$("card").addEventListener("touchend",e=>{
  if(sx===null||!revealed)return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
  if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*1.5) judge(dx>0);
});

function finish(){
  $("bar").style.width="100%";
  const done=okList.length+ngList.length, pct=done?Math.round(okList.length/done*100):0;
  show("result");
  $("rOk").textContent=okList.length; $("rNg").textContent=ngList.length; $("rCombo").textContent=maxCombo;
  $("trophy").textContent = pct===100?"👑":pct>=80?"🏆":pct>=50?"🥈":"📚";
  $("rTitle").textContent = pct===100?"パーフェクト！合格間違いなし！":pct>=80?"すばらしい！あと少し！":pct>=50?"いい調子！":"復習でグッと伸びる！";
  $("ringC").style.strokeDashoffset=402;
  let n=0; $("rPct").textContent="0%";
  const t=setInterval(()=>{n+=Math.max(1,Math.ceil(pct/30)); if(n>=pct){n=pct;clearInterval(t);} $("rPct").textContent=n+"%";},40);
  setTimeout(()=>$("ringC").style.strokeDashoffset=402*(1-pct/100),100);
  $("reviewWrap").innerHTML = ngList.length?`<ul class="review">${ngList.map(q=>`<li>${YEAR_LABEL[q.y]} ${PNAME[q.p]}：<b>${q.term}</b></li>`).join("")}</ul>`:"";
  $("retryBtn").style.display=ngList.length?"block":"none";
  if(pct>=80) setTimeout(()=>rain(),300);
}
$("retryBtn").onclick=()=>start(ngList);
$("homeBtn").onclick=()=>{show("top");renderYears();};

function vib(p){ if(navigator.vibrate) navigator.vibrate(p); }
function pop(t){const d=document.createElement("div");d.className="pop";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000);}
const cv=$("confetti"), cx=cv.getContext("2d"); let parts=[], running=false;
function fit(){[cv,$("stars")].forEach(c=>{c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px";});drawStars();}
addEventListener("resize",fit);
const COLORS=["#f472b6","#facc15","#34d399","#60a5fa","#a78bfa","#fb923c"];
function burst(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*8;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:3+Math.random()*4,c:COLORS[i%6],life:70+Math.random()*30,rot:Math.random()*6,vr:(Math.random()-.5)*.3,sq:Math.random()<.5});}loop();}
function sparkle(x,y){for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,r:2+Math.random()*2,c:"#fde68a",life:40,rot:0,vr:0,sq:false});}loop();}
function rain(){for(let i=0;i<150;i++)parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:3+Math.random()*4,c:COLORS[i%6],life:220,rot:Math.random()*6,vr:(Math.random()-.5)*.2,sq:true});loop();}
function loop(){if(running)return;running=true;(function f(){
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life-->0&&p.y<innerHeight+30);
  for(const p of parts){p.vy+=.18;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.c;
    if(p.sq)cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{cx.beginPath();cx.arc(0,0,p.r,0,7);cx.fill();}cx.restore();}
  if(parts.length)requestAnimationFrame(f);else running=false;})();}
let stars=[];
function drawStars(){const c=$("stars"),g=c.getContext("2d");if(!stars.length)for(let i=0;i<70;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,p:Math.random()*6});
  g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);g.clearRect(0,0,innerWidth,innerHeight);const t=Date.now()/900;
  for(const s of stars){g.globalAlpha=.3+.5*Math.abs(Math.sin(t+s.p));g.fillStyle="#fff";g.beginPath();g.arc(s.x*innerWidth,s.y*innerHeight,s.r,0,7);g.fill();}}
setInterval(drawStars,120);
fit(); renderYears();
</script>
